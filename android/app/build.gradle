plugins { id 'com.android.application' }
android {
    namespace 'app.playbook'
    compileSdk 34
    defaultConfig { applicationId 'app.playbook'; minSdk 26; targetSdk 34; versionCode 4; versionName '0.4' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // ??????????????????????????? assets ??????
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/assets')
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
def copyScript = tasks.register('copyScript', Copy) {
    from '../../play-books-vertical.user.js'
    into layout.buildDirectory.dir('generated/assets')
}
tasks.configureEach { if (it.name.endsWith('Assets')) it.dependsOn copyScript }
